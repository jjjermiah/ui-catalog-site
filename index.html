<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Component catalog</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-left">
      <h1>Component catalog</h1>
      <p>Eleven libraries of React source, none of it written here. <span id="lede-count">2,204</span> items in three degrees of fidelity.</p>
    </div>
    <nav class="views">
      <button id="view-showcase" type="button" aria-pressed="true">Selected</button>
      <button id="view-all" type="button" aria-pressed="false">All items</button>
    </nav>
  </header>

  <div class="key">
    <span><b class="tA">A</b> the library published this file</span>
    <span><b class="tB">B</b> recovered from a compiled bundle</span>
    <span><b class="tC">C</b> rebuilt from the outside</span>
  </div>

  <!-- Selected: a handful of substantial components per library -->
  <main id="showcase"></main>

  <!-- All items: dense index -->
  <main id="catalog" hidden>
    <div class="filters">
      <input id="q" type="search" placeholder="Filter by name, slug, description, category" autocomplete="off" spellcheck="false" />
      <select id="lib" aria-label="Library"></select>
      <select id="tier" aria-label="Tier">
        <option value="">Every tier</option>
        <option value="A">A · published</option>
        <option value="B">B · recovered</option>
        <option value="C">C · rebuilt</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="lines">Largest first</option>
        <option value="name">Name</option>
        <option value="lib">Library</option>
      </select>
      <span id="count" class="count"></span>
    </div>
    <table class="index">
      <thead>
        <tr><th>Component</th><th>Library</th><th class="num">Lines</th><th class="num">Files</th><th class="tiercol">Tier</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <button id="more" class="more" type="button">Show more</button>
    <p id="empty" class="empty" hidden>Nothing matches that.</p>
  </main>

  <section id="drawer" hidden>
    <article id="sheet"></article>
  </section>

  <script src="app.js" type="module"></script>
</body>
</html>
