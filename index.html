<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Component catalog</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>Component catalog</strong>
        <small id="total">loading…</small>
      </div>
    </div>
    <nav id="libs" class="libs"></nav>
    <div class="railfoot">
      <div class="tiers">
        <span class="tier t-A" title="The library published this file itself">A exact</span>
        <span class="tier t-B" title="Compiled module decompiled back to JSX">B recovered</span>
        <span class="tier t-C" title="Someone rebuilt it from the outside">C replica</span>
      </div>
      <button id="theme" class="ghost" type="button">Toggle theme</button>
    </div>
  </aside>

  <main>
    <header class="bar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search components, descriptions…  ( / )" autocomplete="off" spellcheck="false" />
      </div>
      <select id="tier" aria-label="Tier">
        <option value="">All tiers</option>
        <option value="A">A · exact</option>
        <option value="B">B · recovered</option>
        <option value="C">C · replica</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="name">By name</option>
        <option value="lines">By size</option>
        <option value="lib">By library</option>
      </select>
      <span id="count" class="count"></span>
    </header>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="more" class="more"><button class="ghost" type="button">Load more</button></div>
    <div id="empty" class="empty" hidden>Nothing matches that.</div>
  </main>

  <section id="drawer" class="drawer" hidden aria-modal="true" role="dialog">
    <div class="sheet" id="sheet"></div>
  </section>

  <script src="app.js" type="module"></script>
</body>
</html>
